<!DOCTYPE html>
<html>
<head>
    <title>Create Exam - SafeExam</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        .form-card {
            max-width: 600px;
            margin: auto;
        }

        .form-card h3 {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #94a3b8;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .create-btn {
            width: 100%;
            margin-top: 10px;
        }

        .helper-text {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 5px;
        }
    </style>
</head>

<body>

<div class="layout">

    <!-- ================= SIDEBAR ================= -->
    <div class="sidebar">
        <h2>SafeExam</h2>
        <a href="/admin">🏠 Dashboard</a>
        <a href="/create_exam">📝 Create Exam</a>
        <a href="/monitor">📊 Live Monitor</a>
        <a href="/logout">🚪 Logout</a>
    </div>

    <!-- ================= MAIN CONTENT ================= -->
    <div class="main">

        <div class="card form-card">
            <h3>Create New Exam</h3>

            <form method="POST">

                <div class="form-group">
                    <label>Exam Title</label>
                    <input type="text" name="title" placeholder="Enter exam title" required>
                    <div class="helper-text">
                        Example: Data Structures Midterm
                    </div>
                </div>

                <div class="form-group">
                    <label>Duration (Minutes)</label>
                    <input type="number" name="duration" placeholder="Enter duration in minutes" required>
                    <div class="helper-text">
                        Total time students will have to complete the exam.
                    </div>
                </div>

                <button class="create-btn" type="submit">
                    Create Exam & Add Questions
                </button>

            </form>
        </div>

    </div>
</div>

</body>
</html>
