{% extends "base.html" %}
{% from "partials/_macros.html" import icon %}
{% block title %}Forbidden — {{ APP_NAME }}{% endblock %}
{% block body %}
<div class="result-center">
  <div class="result-card">
    <div class="big-ic danger">{{ icon('lock', 'ic-xl') }}</div>
    <h2>403 — Forbidden</h2>
    <p class="muted" style="margin:10px 0 22px;">You don't have permission to view this page.</p>
    <a class="btn" href="{{ url_for('auth.index') }}">{{ icon('chevron') }} Go home</a>
  </div>
</div>
{% endblock %}
